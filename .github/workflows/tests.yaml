name: API tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [auth_service, employees_service]

    name: pytest (${{ matrix.service }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Prepare service layout
        run: |
          WORK="$RUNNER_TEMP/${{ matrix.service }}/app"
          mkdir -p "$WORK"
          cp -r "services/${{ matrix.service }}/." "$WORK/"
          cp -r shared_schemas "$WORK/"
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.WORK }}
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: ${{ env.WORK }}
        env:
          PYTHONPATH: ${{ env.WORK }}
        run: python -m pytest tests -v -p no:cacheprovider
